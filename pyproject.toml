[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "treegen"
version = "0.4.0"
description = "扫描目录，生成带忽略规则的 Markdown 目录树"
requires-python = ">=3.11"

[project.scripts]
treegen = "treegen.cli:main"

[tool.setuptools.packages.find]
include = ["treegen*"]
